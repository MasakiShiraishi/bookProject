<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header text-center">
          <h2>Lägg till citat</h2>
        </div>
        <div class="card-body">
          <form #quoteForm="ngForm" (ngSubmit)="addQuote(quoteForm)">
            <div class="form-group mb-3">
              <label for="text">Citat:</label>
              <input
                id="text"
                [(ngModel)]="newQuote.text"
                name="text"
                class="form-control"
                required
              />
            </div>
            <div class="form-group mb-3">
              <label for="author">Författare:</label>
              <input
                id="author"
                [(ngModel)]="newQuote.author"
                name="author"
                class="form-control"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Skicka in
            </button>
          </form>
          <button
            (click)="navigateToQuoteList()"
            class="btn btn-secondary btn-block mt-3"
          >
            Avbryt
          </button>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger mt-2 text-center">
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>
</div>
